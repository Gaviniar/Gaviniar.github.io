<!DOCTYPE html>
<html lang="zh-CN" data-time="night" data-season="autumn" data-weather="clear" data-tone="dark" data-reading-glass="balanced">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gavin's Blog</title>
  <meta name="description" content="Gavin's Blog — 小舟从此逝，江海寄余生。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- SVG Optical Refraction Filter for Liquid Glass accents -->
  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <defs>
      <filter id="liquid-glass-sheen" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="2" seed="7" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <!-- Living Western Fantasy Pastoral Manor Stage -->
  <div id="manor-stage" aria-hidden="true">
    <div class="manor-parallax-wrap" id="manor-parallax">
      <!-- Dual-buffer lazy crossfade slots for 12-image (4 seasons × day/golden/night) backdrop engine -->
      <img class="manor-layer" id="manor-slot-a" alt="" />
      <img class="manor-layer" id="manor-slot-b" alt="" />
      <!-- Dynamic Sky & Time-of-Day Color Grading Layers -->
      <div class="manor-sky-veil"></div>
      <div class="manor-time-grade"></div>
      <div class="manor-weather-veil"></div>
      <!-- Animated Hearth Firelight & Warm Interior Spill -->
      <div class="manor-hearth-glow" id="hearth-glow"></div>
      <div class="manor-cottage-glow" id="cottage-glow"></div>
    </div>
    <!-- Real-time 60fps Canvas: Stars, Embers, Rain, Snow, Petals, Leaves, Mist, Fireflies -->
    <canvas id="atmosphere-canvas"></canvas>
    <div class="manor-vignette"></div>
  </div>

  <!-- Top Floating Liquid Glass Navigation & Live Beijing-Time HUD -->
  <header class="glass-dock" id="glass-dock">
    <div class="dock-inner">
      <a href="#/" class="brand-mark" data-route="home">
        <span class="brand-dot" aria-hidden="true"></span>
        <span class="brand-name">Gavin's Blog</span>
      </a>

      <nav class="dock-nav" aria-label="主导航">
        <a href="#/" class="nav-link" data-nav="home">
          <span class="nav-idx">01</span>首页
        </a>
        <a href="#/posts" class="nav-link" data-nav="posts">
          <span class="nav-idx">02</span>文章
        </a>
        <a href="#/notes" class="nav-link" data-nav="notes">
          <span class="nav-idx">03</span>碎碎念
        </a>
        <a href="#/about" class="nav-link" data-nav="about">
          <span class="nav-idx">04</span>关于
        </a>
      </nav>

      <div class="dock-controls">
        <button type="button" class="hud-pill" id="atmosphere-toggle" aria-expanded="false" aria-controls="atmosphere-panel" title="切换北京时间时段、季节与天气">
          <span class="hud-clock" id="beijing-clock">--:--</span>
          <span class="hud-sep">·</span>
          <span class="hud-phase" id="hud-phase-label">深夜</span>
          <span class="hud-sep">·</span>
          <span class="hud-env" id="hud-env-label">秋 / 晴</span>
          <svg class="hud-chevron" width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M2.5 4.5L6 8L9.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" />
          </svg>
        </button>

        <button type="button" class="zen-btn" id="zen-toggle" title="纯粹赏景：隐藏文字界面，欣赏雪山、盔甲与炉火">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
            <path d="M1.5 8C3.2 4.8 5.4 3.5 8 3.5C10.6 3.5 12.8 4.8 14.5 8C12.8 11.2 10.6 12.5 8 12.5C5.4 12.5 3.2 11.2 1.5 8Z" stroke="currentColor" stroke-width="1.3"/>
            <circle cx="8" cy="8" r="2.1" stroke="currentColor" stroke-width="1.3"/>
          </svg>
          <span>赏景</span>
        </button>
      </div>
    </div>

    <!-- Collapsible Liquid Glass Atmosphere Control Panel -->
    <section class="atmosphere-panel" id="atmosphere-panel" hidden aria-label="庄园气象与时间控制">
      <div class="atmo-grid">
        <div class="atmo-group">
          <div class="atmo-head">
            <span class="atmo-kicker">01 / BEIJING TIME (UTC+8)</span>
            <button type="button" class="atmo-auto-btn is-active" id="auto-time-btn">
              <span class="pulse-dot"></span>自动同步北京时间
            </button>
          </div>
          <div class="atmo-pills atmo-pills-6" id="time-pills"></div>
        </div>

        <div class="atmo-group">
          <div class="atmo-head">
            <span class="atmo-kicker">02 / SEASON · 季节变换</span>
            <span class="atmo-meta" id="season-meta">自动按公历月份</span>
          </div>
          <div class="atmo-pills atmo-pills-4" id="season-pills"></div>
        </div>

        <div class="atmo-group">
          <div class="atmo-head">
            <span class="atmo-kicker">03 / WEATHER · 气象状态</span>
            <span class="atmo-meta" id="weather-meta">实时粒子渲染</span>
          </div>
          <div class="atmo-pills atmo-pills-4" id="weather-pills"></div>
        </div>
      </div>
    </section>
  </header>

  <!-- Floating Zen Mode Restore Bar -->
  <div class="zen-restore-bar" id="zen-restore-bar" hidden>
    <div class="zen-status">
      <span class="zen-clock" id="zen-clock">--:--:-- CST</span>
      <span class="zen-sep">/</span>
      <span id="zen-scene-desc">深夜 · 秋 · 晴</span>
    </div>
    <button type="button" class="zen-exit-btn" id="zen-exit-btn">返回博客界面</button>
  </div>

  <!-- Main Blog Viewport -->
  <main id="app-root" class="app-root"></main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
